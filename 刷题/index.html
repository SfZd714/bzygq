<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>央国企刷题 · 本地版</title>
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --line:#e3e8ef; --text:#1f2937; --muted:#6b7280;
  --pri:#2563eb; --pri-soft:#eff6ff; --ok:#059669; --ok-soft:#ecfdf5;
  --bad:#dc2626; --bad-soft:#fef2f2; --warn:#d97706; --warn-soft:#fffbeb;
  --radius:12px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.nav{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:4px;padding:0 16px;height:56px;overflow-x:auto}
.nav .brand{font-weight:700;font-size:16px;margin-right:12px;white-space:nowrap;color:var(--pri)}
.nav a{padding:6px 12px;border-radius:8px;color:var(--muted);text-decoration:none;
  font-size:14px;white-space:nowrap;cursor:pointer}
.nav a:hover{background:#f3f4f6;color:var(--text)}
.nav a.on{background:var(--pri-soft);color:var(--pri);font-weight:600}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px}
h2{margin:0 0 12px;font-size:17px}
h3{margin:0 0 8px;font-size:15px;color:var(--muted);font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:8px 16px;
  border-radius:8px;cursor:pointer;font-size:14px;font-family:inherit}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{opacity:.9;color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{padding:5px 11px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 13px;
  font-size:13px;cursor:pointer;user-select:none}
.chip:hover{border-color:var(--pri)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chip .n{opacity:.65;font-size:12px;margin-left:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:center}
.stat .v{font-size:24px;font-weight:700;line-height:1.2}
.stat .k{font-size:12px;color:var(--muted);margin-top:2px}
.bar{height:8px;background:#eef2f7;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);border-radius:99px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:13px}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tag{font-size:12px;padding:2px 8px;border-radius:6px;background:#f1f5f9;color:var(--muted)}
.tag.g{background:var(--pri-soft);color:var(--pri)}
.qtext{font-size:16px;line-height:1.9;white-space:pre-wrap;word-break:break-word}
.qtext .mat{color:var(--muted);font-size:14px}
.imgs{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.imgs img{max-width:100%;max-height:340px;border:1px solid var(--line);border-radius:8px;background:#fff}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;
  padding:11px 13px;cursor:pointer;background:#fff;text-align:left;font:inherit;color:inherit;width:100%}
.opt:hover{border-color:var(--pri);background:#fafbff}
.opt .k{font-weight:700;min-width:20px;color:var(--muted)}
.opt.sel{border-color:var(--pri);background:var(--pri-soft)}
.opt.sel .k{color:var(--pri)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{color:var(--bad)}
.opt.locked{cursor:default}
.fb{margin-top:14px;border-radius:10px;padding:12px 14px;font-size:14px}
.fb.ok{background:var(--ok-soft);color:#065f46;border:1px solid #a7f3d0}
.fb.bad{background:var(--bad-soft);color:#991b1b;border:1px solid #fecaca}
.fb b{font-weight:700}
.fb .ana{margin-top:8px;padding-top:8px;border-top:1px dashed rgba(0,0,0,.12);
  white-space:pre-wrap;color:var(--text);line-height:1.8}
.prog{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.prog .bar{flex:1}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:7px;margin-top:10px}
.sheet b{display:flex;align-items:center;justify-content:center;height:34px;border:1px solid var(--line);
  border-radius:7px;font-size:13px;cursor:pointer;background:#fff;font-weight:500}
.sheet b.done{background:var(--pri-soft);border-color:#bfdbfe;color:var(--pri)}
.sheet b.cur{outline:2px solid var(--pri)}
.list{display:flex;flex-direction:column;gap:9px}
.item{border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:#fff;cursor:pointer}
.item:hover{border-color:var(--pri)}
.item .t{font-size:14px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.item .m{font-size:12px;color:var(--muted);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:34px 0}
.muted{color:var(--muted)}
.small{font-size:13px}
.hr{height:1px;background:var(--line);margin:14px 0}
.timer{font-variant-numeric:tabular-nums;font-weight:600}
input[type=number],select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;
  font:inherit;font-size:14px;background:#fff;color:var(--text)}
.pager{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:14px}
</style>
</head>
<body>
<nav class="nav">
  <span class="brand">央国企刷题</span>
  <a data-v="home">首页</a>
  <a data-v="practice">练习</a>
  <a data-v="recite">背题</a>
  <a data-v="exam">组卷</a>
  <a data-v="wrong">错题本</a>
  <a data-v="fav">收藏</a>
  <a data-v="stats">统计</a>
  <a data-v="set">设置</a>
  <a data-v="lib">📚 资料库</a>
</nav>
<div class="wrap" id="app"></div>

<script src="questions.js"></script>
<script>
/* ---------------- 数据 ---------------- */
let Q = window.QUESTIONS || [];
const TYPE = {1:'单选',2:'多选',3:'判断',6:'材料单选'};
const $ = s => document.querySelector(s);
const app = $('#app');

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const ls = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alert('本地存储写入失败，可能空间已满')}}
};
let REC = ls.get('hxq_rec',{});      // qid -> [对,错]
let FAV = ls.get('hxq_fav',{});      // qid -> 1
let MAST= ls.get('hxq_mast',{});     // qid -> 1 已掌握（移出错题本）
let CFG = ls.get('hxq_cfg',{instant:1,shuffle:0,num:20,examNum:50,examMin:60});
let SES = ls.get('hxq_ses',null);    // 当前会话
const saveRec=()=>ls.set('hxq_rec',REC), saveFav=()=>ls.set('hxq_fav',FAV),
      saveMast=()=>ls.set('hxq_mast',MAST), saveCfg=()=>ls.set('hxq_cfg',CFG),
      saveSes=()=>ls.set('hxq_ses',SES);

/* ---------------- 索引 ---------------- */
let GROUPS=[], PAPERS={}, IDX={};
function buildIndex(){
  const gs={}, ps={};
  Q.forEach(q=>{ (gs[q.g]=gs[q.g]||new Set()).add(q.p); IDX[q.i]=q; });
  GROUPS=Object.keys(gs);
  Object.keys(gs).forEach(g=>{PAPERS[g]=[...gs[g]].sort()});
}
function normAns(s){return String(s||'').toUpperCase().replace(/[^A-E]/g,'').split('').sort().join('')}
function isMulti(q){return q.t===2}
const wrongIds = ()=>Q.filter(q=>REC[q.i]&&REC[q.i][1]>0&&!MAST[q.i]).map(q=>q.i);
const favIds   = ()=>Q.filter(q=>FAV[q.i]).map(q=>q.i);

/* ---------------- 路由 ---------------- */
let VIEW='home';
function go(v){VIEW=v;render();window.scrollTo(0,0)}
document.querySelectorAll('.nav a').forEach(a=>a.onclick=()=>go(a.dataset.v));

function render(){
  document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===VIEW));
  ({home:vHome,practice:vPractice,recite:vRecite,exam:vExam,wrong:vWrong,fav:vFav,stats:vStats,set:vSet,lib:vLib}[VIEW]||vHome)();
}

/* ---------------- 首页 ---------------- */
function vHome(){
  const done=Object.keys(REC).length;
  let r=0,w=0; Object.values(REC).forEach(([a,b])=>{r+=a;w+=b});
  const rate = r+w ? Math.round(r/(r+w)*100) : 0;
  const wk=wrongIds().length, fv=favIds().length;
  app.innerHTML = `
  <div class="stats">
    <div class="stat"><div class="v">${Q.length}</div><div class="k">题库总量</div></div>
    <div class="stat"><div class="v">${done}</div><div class="k">已做题目</div></div>
    <div class="stat"><div class="v" style="color:var(--ok)">${rate}%</div><div class="k">总正确率</div></div>
    <div class="stat"><div class="v" style="color:var(--bad)">${wk}</div><div class="k">错题</div></div>
    <div class="stat"><div class="v" style="color:var(--warn)">${fv}</div><div class="k">收藏</div></div>
  </div>
  <div class="card" style="margin-top:14px">
    <h2>按分类练习</h2>
    <div class="chips">${GROUPS.map(g=>{
      const n=Q.filter(q=>q.g===g).length;
      return `<span class="chip" data-g="${esc(g)}">${esc(g)}<span class="n">${n}</span></span>`}).join('')}
    </div>
    <div class="hr"></div>
    <h3>${PAPERS[GROUPS[0]]?'细分题库':'题库'}</h3>
    <div class="chips" id="ps"></div>
  </div>
  <div class="card">
    <h2>快捷入口</h2>
    <div class="row">
      <button class="btn pri" onclick="quick('all')">全部题库顺序练</button>
      <button class="btn" onclick="quick('wrong')">重做错题（${wk}）</button>
      <button class="btn" onclick="quick('undo')">只练未做题</button>
      <button class="btn" onclick="quick('fav')">练收藏（${fv}）</button>
    </div>
    ${SES?`<div class="hr"></div><div class="row">
      <span class="small muted">上次练习停在 ${SES.idx+1}/${SES.list.length} 题</span>
      <button class="btn sm pri" onclick="resume()">继续</button>
      <button class="btn sm" onclick="dropSes()">放弃</button></div>`:''}
  </div>`;
  app.querySelectorAll('.chip[data-g]').forEach(c=>c.onclick=()=>{
    app.querySelectorAll('.chip[data-g]').forEach(x=>x.classList.remove('on'));
    c.classList.add('on'); showPapers(c.dataset.g);
  });
  if(GROUPS[0]) showPapers(GROUPS[0]);
}
function showPapers(g){
  const el=$('#ps'); if(!el) return;
  el.innerHTML = PAPERS[g].map(p=>{
    const n=Q.filter(q=>q.g===g&&q.p===p).length;
    return `<span class="chip" onclick="startPaper('${esc(g)}','${esc(p)}')">${esc(p)}<span class="n">${n}</span></span>`;
  }).join('');
}
function startPaper(g,p){ start(Q.filter(q=>q.g===g&&q.p===p).map(q=>q.i),'practice') }
function quick(kind){
  if(kind==='all') start(Q.map(q=>q.i),'practice');
  else if(kind==='wrong'){const ids=wrongIds(); if(!ids.length)return alert('错题本是空的'); start(ids,'practice')}
  else if(kind==='undo'){const ids=Q.filter(q=>!REC[q.i]).map(q=>q.i); if(!ids.length)return alert('已经全部做过了'); start(ids,'practice')}
  else if(kind==='fav'){const ids=favIds(); if(!ids.length)return alert('还没有收藏'); start(ids,'practice')}
}
function resume(){ if(SES) go(SES.mode==='exam'?'exam':'practice') }
function dropSes(){ SES=null;saveSes();render() }

/* ---------------- 会话 ---------------- */
function start(ids,mode,opt){
  if(!ids.length) return alert('没有符合条件的题目');
  let list=[...new Set(ids)];
  if(CFG.shuffle&&mode!=='recite') list=shuffle(list);
  if(mode==='exam') list=list.slice(0,opt&&opt.num||CFG.examNum);
  SES={list,idx:0,ans:{},mode,start:Date.now(),limit:(opt&&opt.min||CFG.examMin)*60000,done:0,src:opt&&opt.src||''};
  saveSes(); go(mode==='exam'?'exam':mode);
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function record(qid,ok){
  REC[qid]=REC[qid]||[0,0];
  if(ok) REC[qid][0]++; else REC[qid][1]++;
  saveRec();
}

/* ---------------- 练习 ---------------- */
function vPractice(){
  if(!SES){ return vSetup('practice') }
  const q=IDX[SES.list[SES.idx]];
  if(!q){ SES.idx=Math.max(0,SES.list.length-1);saveSes();return render() }
  app.innerHTML = sessionBar(q) + qCard(q,false);
  bindAnswer(q,true);
}
function vRecite(){
  if(!SES){ return vSetup('recite') }
  const q=IDX[SES.list[SES.idx]];
  if(!q){ SES.idx=Math.max(0,SES.list.length-1);saveSes();return render() }
  app.innerHTML = sessionBar(q) + qCard(q,true);
  app.querySelectorAll('.opt').forEach(o=>o.classList.add('locked'));
  normAns(q.a).split('').forEach(k=>app.querySelector('.opt[data-k="'+k+'"]')?.classList.add('right'));
  app.querySelector('#fb').innerHTML =
    `<div class="fb ok"><b>答案 ${esc(q.a)}</b>${q.e?`<div class="ana">${esc(q.e)}</div>`:''}</div>`;
}
function sessionBar(q){
  const n=SES.list.length, cur=SES.idx+1;
  const sec=Math.floor((Date.now()-SES.start)/1000);
  return `<div class="card">
    <div class="prog">
      <b>${cur}/${n}</b>
      <div class="bar"><i style="width:${cur/n*100}%"></i></div>
      <span class="small muted timer">${SES.mode==='exam'?fmt(SES.limit-(Date.now()-SES.start)):fmt(sec*1000)}</span>
    </div>
    <div class="row">
      <button class="btn sm" onclick="jump(-1)" ${SES.idx?'':'disabled'}>上一题</button>
      <button class="btn sm" onclick="jump(1)">${cur===n?'完成':'下一题'}</button>
      <button class="btn sm" onclick="toggleFav()">${FAV[q.i]?'★ 取消收藏':'☆ 收藏'}</button>
      <span class="grow"></span>
      ${SES.mode==='exam'?'<button class="btn sm" onclick="toggleSheet()">答题卡</button><button class="btn sm pri" onclick="submitExam()">交卷</button>'
        :`<button class="btn sm" onclick="dropSes()">结束练习</button>`}
    </div>
    <div id="sheet" style="display:none"><div class="sheet">
      ${SES.list.map((id,i)=>`<b class="${SES.ans[id]!==undefined?'done':''} ${i===SES.idx?'cur':''}" onclick="jumpTo(${i})">${i+1}</b>`).join('')}
    </div></div>
  </div>`;
}
function fmt(ms){ms=Math.max(0,ms);const s=Math.floor(ms/1000);
  return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function qCard(q,showAns){
  const multi=isMulti(q);
  const matIdx=q.q.indexOf('【资料】');
  let body=q.q;
  if(matIdx===0){
    const sp=q.q.indexOf('题干：');
    if(sp>0) body=`<span class="mat">${esc(q.q.slice(0,sp))}</span>${esc(q.q.slice(sp))}`;
    else body=esc(q.q);
  } else body=esc(q.q);
  return `<div class="card">
    <div class="qmeta">
      <span class="tag g">${esc(q.g)}</span><span class="tag">${esc(q.p)}</span>
      <span class="tag">${TYPE[q.t]||q.t}</span>
      ${multi?'<span class="tag" style="background:var(--warn-soft);color:var(--warn)">多选</span>':''}
    </div>
    <div class="qtext">${body}</div>
    ${q.m&&q.m.length?`<div class="imgs">${q.m.map(u=>`<img src="${esc(u)}" loading="lazy">`).join('')}</div>`:''}
    <div class="opts">
      ${Object.entries(q.o).map(([k,v])=>`<button class="opt" data-k="${k}"><span class="k">${k}</span><span>${esc(v)}</span></button>`).join('')}
    </div>
    ${multi?'<div class="row" style="margin-top:12px"><button class="btn pri sm" id="confirm">确认作答</button><span class="small muted">多选题可点选多个选项</span></div>':''}
    <div id="fb"></div>
  </div>`;
}
function bindAnswer(q,practice){
  const multi=isMulti(q);
  const isExam=SES.mode==='exam';
  let picked=SES.ans[q.i]!==undefined?String(SES.ans[q.i]):'';
  const paint=()=>app.querySelectorAll('.opt').forEach(o=>
    o.classList.toggle('sel',picked.includes(o.dataset.k)));
  paint();
  app.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
    // 考试模式：仅记录答案、可改、不揭示对错
    if(isExam){
      if(multi){ picked = picked.includes(o.dataset.k)
          ? picked.split('').filter(c=>c!==o.dataset.k).join('')
          : (picked+o.dataset.k); }
      else { picked=o.dataset.k; }
      SES.ans[q.i]=picked; saveSes();
      paint(); return;
    }
    if(SES.ans[q.i]!==undefined) return; // 练习已作答，不可改
    if(multi){ picked = picked.includes(o.dataset.k)
        ? picked.split('').filter(c=>c!==o.dataset.k).join('')
        : (picked+o.dataset.k); paint(); }
    else { picked=o.dataset.k; paint(); judge(q,picked,practice) }
  });
  const cf=$('#confirm');
  if(cf) cf.onclick=()=>{ if(picked && !isExam) judge(q,picked,practice) };
  if(!isExam && SES.ans[q.i]!==undefined) judge(q,String(SES.ans[q.i]),practice,true);
}
function judge(q,picked,practice,redo){
  const ok = normAns(picked)===normAns(q.a);
  if(SES.ans[q.i]===undefined){ SES.ans[q.i]=picked; SES.done=Object.keys(SES.ans).length; saveSes(); }
  if(SES.mode==='practice' && !redo) record(q.i,ok);   // 仅练习模式计入记录，组卷在交卷时统一记、解析模式不重复记
  const multi=isMulti(q);
  app.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('locked');
    if(normAns(q.a).includes(o.dataset.k)) o.classList.add('right');
    else if(picked.includes(o.dataset.k)) o.classList.add('wrong');
  });
  const cf=$('#confirm'); if(cf) cf.disabled=true;
  const ansTxt = Object.keys(q.o).filter(k=>normAns(q.a).includes(k)).map(k=>k+'. '+q.o[k]).join('　');
  $('#fb').innerHTML = `<div class="fb ${ok?'ok':'bad'}">
      <b>${ok?'回答正确':'回答错误'}</b>　你的答案 ${esc(picked||'未答')}${ok?'':'　正确答案 '+esc(q.a)}
      ${!ok?`<div>正确答案：${esc(ansTxt)}</div>`:''}
      ${q.e?`<div class="ana"><b>解析：</b>${esc(q.e)}</div>`:''}
    </div>`;
  if(!multi && practice && SES.mode!=='exam') setTimeout(()=>{ if(SES.idx<SES.list.length-1) jump(1) },900);
}
function jump(d){
  const n=SES.list.length;
  if(SES.idx+d>=n){
    if(SES.mode==='exam') return submitExam();
    if(SES.mode==='review') return; // 已是最后一题
    return finish();
  }
  SES.idx=Math.max(0,SES.idx+d); saveSes(); render();
}
function jumpTo(i){SES.idx=i;saveSes();render()}
function toggleFav(){
  const q=IDX[SES.list[SES.idx]];
  if(FAV[q.i]) delete FAV[q.i]; else FAV[q.i]=1;
  saveFav(); render();
}
function toggleSheet(){const s=$('#sheet');s.style.display=s.style.display==='none'?'block':'none'}
function finish(){
  if(SES.mode==='exam') return submitExam();
  alert('本轮练习已完成'); SES=null;saveSes();go('home');
}

/* ---------------- 练习配置 ---------------- */
function vSetup(mode){
  if(!window._setup) window._setup={groups:[],papers:[],types:[1,2,3,6]};
  const st=window._setup;
  const pool = filterPool(st);
  app.innerHTML = `
  <div class="card">
    <h2>${mode==='recite'?'背题模式':'练习模式'} · 选题</h2>
    <h3>分类（不选=全部）</h3>
    <div class="chips">${GROUPS.map(g=>`<span class="chip ${st.groups.includes(g)?'on':''}" data-g="${esc(g)}">${esc(g)}</span>`).join('')}</div>
    <div class="hr"></div>
    <h3>细分题库（不选=全部分类下所有）</h3>
    <div class="chips" id="sp">${(st.groups.length?st.groups.flatMap(g=>PAPERS[g]):GROUPS.flatMap(g=>PAPERS[g]))
      .map(p=>`<span class="chip ${st.papers.includes(p)?'on':''}" data-p="${esc(p)}">${esc(p)}</span>`).join('')}</div>
    <div class="hr"></div>
    <h3>题型</h3>
    <div class="chips">${Object.entries(TYPE).map(([t,n])=>`<span class="chip ${st.types.includes(+t)?'on':''}" data-t="${t}">${n}</span>`).join('')}</div>
    <div class="hr"></div>
    <div class="row">
      <label class="small">题量
        <select id="num">${[20,50,100,200,'全部'].map(v=>`<option value="${v}" ${CFG.num==v?'selected':''}>${v}</option>`).join('')}</select>
      </label>
      <label class="small"><input type="checkbox" id="sh" ${CFG.shuffle?'checked':''}> 乱序</label>
      <span class="grow"></span>
      <span class="small muted">命中 <b id="hit">${pool.length}</b> 题</span>
    </div>
    <div class="hr"></div>
    <button class="btn pri" onclick="doStart('${mode}')">开始${mode==='recite'?'背题':'练习'}</button>
  </div>`;
  app.querySelectorAll('.chip[data-g]').forEach(c=>c.onclick=()=>{
    const g=c.dataset.g; const i=st.groups.indexOf(g);
    i<0?st.groups.push(g):st.groups.splice(i,1);
    st.papers=st.papers.filter(p=>st.groups.length?st.groups.some(g2=>PAPERS[g2].includes(p)):true);
    vSetup(mode);
  });
  app.querySelectorAll('.chip[data-p]').forEach(c=>c.onclick=()=>{
    const p=c.dataset.p; const i=st.papers.indexOf(p); i<0?st.papers.push(p):st.papers.splice(i,1); vSetup(mode);
  });
  app.querySelectorAll('.chip[data-t]').forEach(c=>c.onclick=()=>{
    const t=+c.dataset.t; const i=st.types.indexOf(t); i<0?st.types.push(t):st.types.splice(i,1); vSetup(mode);
  });
  $('#num').onchange=e=>{CFG.num=isNaN(+e.target.value)?'全部':+e.target.value;saveCfg();vSetup(mode)};
  $('#sh').onchange=e=>{CFG.shuffle=e.target.checked?1:0;saveCfg()};
}
function filterPool(st){
  return Q.filter(q=>(!st.groups.length||st.groups.includes(q.g))
    &&(!st.papers.length||st.papers.includes(q.p))
    &&(!st.types.length||st.types.includes(q.t)));
}
function doStart(mode){
  const st=window._setup; let pool=filterPool(st);
  if(!pool.length) return alert('没有命中的题目');
  if(CFG.shuffle) pool=shuffle(pool);
  if(CFG.num!=='全部') pool=pool.slice(0,+CFG.num);
  start(pool.map(q=>q.i),mode);
}

/* ---------------- 组卷 ---------------- */
function vExam(){
  if(SES&&(SES.mode==='exam'||SES.mode==='review')){
    if(SES.mode==='exam'&&Date.now()-SES.start>=SES.limit) return submitExam();
    return vExamRun();
  }
  app.innerHTML=`<div class="card">
    <h2>模拟组卷</h2>
    <p class="small muted">从选定范围随机抽题，限时作答，交卷后统一判分。</p>
    <div class="row" style="margin:12px 0">
      <label class="small">范围
        <select id="scope">${GROUPS.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('')}
          <option value="__ALL__">全部题库</option></select></label>
      <label class="small">题数 <input type="number" id="en" value="${CFG.examNum}" min="5" max="500" style="width:80px"></label>
      <label class="small">时长(分钟) <input type="number" id="em" value="${CFG.examMin}" min="5" max="300" style="width:80px"></label>
    </div>
    <button class="btn pri" onclick="startExam()">生成试卷并开始</button>
  </div>`;
}
function vExamRun(){
  const q=IDX[SES.list[SES.idx]];
  app.innerHTML=sessionBar(q)+qCard(q,false);
  bindAnswer(q,true);
  const answered=SES.ans[q.i];
  if(answered!==undefined){
    app.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',String(answered).includes(o.dataset.k)));
  }
  clearInterval(window._t);
  window._t=setInterval(()=>{
    if(Date.now()-SES.start>=SES.limit){clearInterval(window._t);submitExam();return}
    const el=$('.timer'); if(el) el.textContent=fmt(SES.limit-(Date.now()-SES.start));
  },1000);
}
function startExam(){
  const scope=$('#scope').value, num=Math.max(5,Math.min(500,+$('#en').value||50)),
        min=Math.max(5,Math.min(300,+$('#em').value||60));
  CFG.examNum=num;CFG.examMin=min;saveCfg();
  let pool = scope==='__ALL__'?Q.map(q=>q.i):Q.filter(q=>q.g===scope).map(q=>q.i);
  start(pool,'exam',{num,min,src:scope});
}
function submitExam(){
  clearInterval(window._t);
  let right=0;
  SES.list.forEach(id=>{
    const q=IDX[id]; if(!q) return;
    const a=SES.ans[id]; const ok=a!==undefined&&normAns(a)===normAns(q.a);
    if(ok) right++;
    record(id,ok);
  });
  const score=Math.round(right/SES.list.length*100);
  const used=Date.now()-SES.start;
  app.innerHTML=`<div class="card" style="text-align:center">
    <h2>交卷完成</h2>
    <div class="stats" style="margin:14px 0">
      <div class="stat"><div class="v" style="color:${score>=60?'var(--ok)':'var(--bad)'}">${score}</div><div class="k">得分</div></div>
      <div class="stat"><div class="v">${right}/${SES.list.length}</div><div class="k">答对</div></div>
      <div class="stat"><div class="v">${fmt(used)}</div><div class="k">用时</div></div>
    </div>
    <div class="row" style="justify-content:center">
      <button class="btn pri" onclick="reviewExam()">查看解析</button>
      <button class="btn" onclick="SES=null;saveSes();go('exam')">再来一套</button>
      <button class="btn" onclick="SES=null;saveSes();go('home')">返回首页</button>
    </div>
  </div>`;
}
function reviewExam(){
  const wrong=SES.list.filter(id=>{const q=IDX[id];return q&&normAns(SES.ans[id])!==normAns(q.a)});
  const only=confirm('只看错题？（取消 = 看全部）');
  const list=only&&wrong.length?wrong:SES.list;
  SES={list,idx:0,ans:{...SES.ans},mode:'review',start:Date.now(),limit:0,done:0};
  saveSes(); go('exam');
}

/* ---------------- 错题本 / 收藏 ---------------- */
let listPage=0;
function vWrong(){ renderQList('错题本',wrongIds(),'wrong',true) }
function vFav(){ renderQList('收藏',favIds(),'fav',false) }
function renderQList(title,ids,kind,showMaster){
  const per=20, pages=Math.max(1,Math.ceil(ids.length/per));
  if(listPage>=pages) listPage=0;
  const slice=ids.slice(listPage*per,listPage*per+per);
  app.innerHTML=`<div class="card">
    <div class="row"><h2 class="grow" style="margin:0">${title}（${ids.length}）</h2>
      ${ids.length?`<button class="btn sm pri" onclick="start(window.__ids,'practice')">练习这些题</button>
      ${showMaster?`<button class="btn sm" onclick="clearWrong()">清空错题本</button>`:''}`:''}
    </div>
    <div class="hr"></div>
    ${ids.length?`<div class="list">${slice.map(id=>{
      const q=IDX[id]; const rec=REC[id]||[0,0];
      return `<div class="item" onclick="peek(${id})">
        <div class="t">${esc(q.q.slice(0,120))}</div>
        <div class="m"><span class="tag g">${esc(q.g)}</span><span class="tag">${esc(q.p)}</span>
        <span>${TYPE[q.t]}</span><span>对${rec[0]} 错${rec[1]}</span>
        ${FAV[id]?'<span>★ 已收藏</span>':''}</div></div>`}).join('')}</div>
      <div class="pager">
        <button class="btn sm" onclick="page(-1)" ${listPage?'':'disabled'}>上一页</button>
        <span class="small muted">${listPage+1}/${pages}</span>
        <button class="btn sm" onclick="page(1)" ${listPage+1<pages?'':'disabled'}>下一页</button>
      </div>`
      :`<div class="empty">${kind==='wrong'?'还没有错题，去做几道题吧':'还没有收藏的题目'}</div>`}
  </div>`;
  window.__ids=ids; window.__kind=kind;
}
function page(d){listPage+=d;render()}
function clearWrong(){
  if(!confirm('确定清空错题本？（会把所有错题标记为已掌握）')) return;
  wrongIds().forEach(id=>MAST[id]=1); saveMast(); render();
}
function peek(id){
  const q=IDX[id];
  const ansTxt=Object.keys(q.o).filter(k=>normAns(q.a).includes(k)).map(k=>k+' '+q.o[k]).join('　');
  app.innerHTML=`<div class="card">
    <div class="row"><button class="btn sm" onclick="go('${window.__kind}')">← 返回</button>
      <button class="btn sm" onclick="toggleFavId(${id})">${FAV[id]?'★ 取消收藏':'☆ 收藏'}</button>
      ${window.__kind==='wrong'?`<button class="btn sm ok" onclick="master(${id})">标记已掌握</button>`:''}
    </div><div class="hr"></div>
    <div class="qmeta"><span class="tag g">${esc(q.g)}</span><span class="tag">${esc(q.p)}</span><span class="tag">${TYPE[q.t]}</span></div>
    <div class="qtext">${esc(q.q)}</div>
    ${q.m&&q.m.length?`<div class="imgs">${q.m.map(u=>`<img src="${esc(u)}">`).join('')}</div>`:''}
    <div class="fb ok"><b>答案 ${esc(q.a)}</b>　${esc(ansTxt)}${q.e?`<div class="ana"><b>解析：</b>${esc(q.e)}</div>`:''}</div>
  </div>`;
}
function master(id){MAST[id]=1;saveMast();go('wrong')}
function toggleFavId(id){ if(FAV[id])delete FAV[id];else FAV[id]=1; saveFav(); peek(id) }

/* ---------------- 统计 ---------------- */
function vStats(){
  let r=0,w=0,done=0;
  Q.forEach(q=>{ if(REC[q.i]){done++;r+=REC[q.i][0];w+=REC[q.i][1]} });
  const rows=GROUPS.map(g=>{
    const qs=Q.filter(q=>q.g===g); let gr=0,gw=0,gd=0;
    qs.forEach(q=>{if(REC[q.i]){gd++;gr+=REC[q.i][0];gw+=REC[q.i][1]}});
    const rate=gr+gw?Math.round(gr/(gr+gw)*100):0;
    return {g,total:qs.length,done:gd,rate};
  });
  const prs={};
  Q.forEach(q=>{const k=q.p;prs[k]=prs[k]||{t:0,r:0,w:0,d:0};
    prs[k].t++; if(REC[q.i]){prs[k].d++;prs[k].r+=REC[q.i][0];prs[k].w+=REC[q.i][1]}});
  const pRows=Object.entries(prs).sort((a,b)=>b[1].d-a[1].d).slice(0,12);
  app.innerHTML=`
  <div class="stats">
    <div class="stat"><div class="v">${done}</div><div class="k">已做题数</div></div>
    <div class="stat"><div class="v">${Q.length-done}</div><div class="k">未做</div></div>
    <div class="stat"><div class="v" style="color:var(--ok)">${r}</div><div class="k">答对次数</div></div>
    <div class="stat"><div class="v" style="color:var(--bad)">${w}</div><div class="k">答错次数</div></div>
    <div class="stat"><div class="v">${r+w?Math.round(r/(r+w)*100):0}%</div><div class="k">总正确率</div></div>
  </div>
  <div class="card" style="margin-top:14px">
    <h2>分类掌握度</h2>
    <table><thead><tr><th>分类</th><th>题量</th><th>已做</th><th>正确率</th></tr></thead><tbody>
    ${rows.map(x=>`<tr><td>${esc(x.g)}</td><td>${x.total}</td><td>${x.done}</td>
      <td><div class="row" style="gap:8px"><div class="bar grow" style="max-width:180px"><i style="width:${x.rate}%"></i></div><b>${x.rate}%</b></div></td></tr>`).join('')}
    </tbody></table>
  </div>
  <div class="card">
    <h2>题库进度（按已做量排序，前 12）</h2>
    <table><thead><tr><th>题库</th><th>题量</th><th>已做</th><th>正确率</th></tr></thead><tbody>
    ${pRows.map(([k,v])=>{const rate=v.r+v.w?Math.round(v.r/(v.r+v.w)*100):0;
      return `<tr><td>${esc(k)}</td><td>${v.t}</td><td>${v.d}</td>
      <td><div class="row" style="gap:8px"><div class="bar grow" style="max-width:180px"><i style="width:${rate}%"></i></div><b>${rate}%</b></div></td></tr>`}).join('')}
    </tbody></table>
  </div>`;
}

/* ---------------- 设置 ---------------- */
function vSet(){
  app.innerHTML=`<div class="card">
    <h2>设置</h2>
    <div class="row"><label class="small"><input type="checkbox" id="inst" ${CFG.instant?'checked':''}> 练习模式即时判题</label></div>
    <div class="hr"></div>
    <h3>数据</h3>
    <div class="row">
      <button class="btn sm" onclick="expData()">导出进度</button>
      <button class="btn sm" onclick="document.getElementById('imp').click()">导入进度</button>
      <input type="file" id="imp" accept=".json" style="display:none" onchange="impData(this)">
      <span class="grow"></span>
      <button class="btn sm" onclick="resetAll()" style="color:var(--bad);border-color:#fecaca">清空所有进度</button>
    </div>
    <div class="hr"></div>
    <h3>关于</h3>
    <p class="small muted">题库共 ${Q.length} 道选择题，数据全部保存在本地浏览器（localStorage），不联网、不上传。
    题目图片存放在同目录 images/ 下。直接双击本文件即可离线使用。</p>
  </div>`;
  $('#inst').onchange=e=>{CFG.instant=e.target.checked?1:0;saveCfg()};
}
function expData(){
  const blob=new Blob([JSON.stringify({rec:REC,fav:FAV,mast:MAST,cfg:CFG})],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='刷题进度_'+new Date().toISOString().slice(0,10)+'.json'; a.click();
}
function impData(el){
  const f=el.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
    if(d.rec)REC=d.rec; if(d.fav)FAV=d.fav; if(d.mast)MAST=d.mast; if(d.cfg)CFG=d.cfg;
    saveRec();saveFav();saveMast();saveCfg(); alert('导入成功'); render();
  }catch(e){alert('文件格式不正确')}};
  r.readAsText(f);
}
function resetAll(){
  if(!confirm('会清空答题记录、错题本和收藏，确定？')) return;
  REC={};FAV={};MAST={};SES=null;
  saveRec();saveFav();saveMast();saveSes(); go('home');
}

/* ---------------- 资料库（四川中烟工业D类） ---------------- */
function vLib(){
  const url = '../../2025年四川中烟工业D类/index.html';
  app.innerHTML = `<div class="card" style="margin-bottom:8px">
    <div class="row"><h2 class="grow" style="margin:0">📚 四川中烟工业 D 类资料库</h2>
      <a class="btn pri" href="${url}" target="_blank" rel="noopener">↗ 在新窗口打开</a></div>
    <p class="small muted" style="margin:6px 0 0">含 PDF / 讲义 / 填空等资料。点文件名预览或打开；若内嵌空白，点预览区「📑 新窗口」用浏览器原生阅读器。资料浏览器默认已收起侧栏，可点 ☰ 展开、用 ← / → 翻篇。</p>
  </div>
  <iframe src="${url}" style="width:100%;height:calc(100vh - 175px);border:1px solid var(--line);border-radius:var(--radius);background:#fff" allow="fullscreen"></iframe>`;
}

/* ---------------- 启动 ---------------- */
function boot(){
  if(!Q.length){
    fetch('questions.json').then(r=>r.json()).then(d=>{
      Q=d.map(x=>({i:x.qid,g:x.group,p:x.paper,t:x.type,q:x.content,o:x.options,a:x.answer,e:x.analysis,m:x.images}));
      buildIndex(); render();
    }).catch(()=>{app.innerHTML='<div class="card"><div class="empty">题库加载失败：请确认 questions.js 或 questions.json 与本页面在同一目录。<br>若用 file:// 打开，必须使用 questions.js。</div></div>'});
    return;
  }
  buildIndex(); render();
}
document.addEventListener('keydown',e=>{
  if(!SES||!IDX[SES.list[SES.idx]]) return;
  const q=IDX[SES.list[SES.idx]];
  if(e.key>='1'&&e.key<='4'&&!isMulti(q)){const k='ABCD'[+e.key-1];
    const b=app.querySelector('.opt[data-k="'+k+'"]'); if(b)b.click()}
  if(e.key==='Enter') jump(1);
  if(e.key==='ArrowRight') jump(1);
  if(e.key==='ArrowLeft') jump(-1);
});
boot();
</script>
